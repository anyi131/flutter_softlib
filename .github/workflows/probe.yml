name: Probe Analyze Only

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (new)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - name: Version info
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Pub outdated
        run: flutter pub outdated || true

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/analyze.txt 2>&1
          echo "=== error count ==="
          grep -c " error •" /tmp/analyze.txt
          echo "=== first 40 errors ==="
          grep " error •" /tmp/analyze.txt | head -40
